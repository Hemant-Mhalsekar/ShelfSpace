name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit + integration tests. Testcontainers starts MySQL using the runner's Docker.
      - name: mvn verify
        run: mvn -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # Component tests: jsdom + a mocked API, no backend needed
      - run: npm test
      # tsc type-check + production build
      - run: npm run build

  e2e:
    name: Docker build and end-to-end test
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4

      # Builds the API and web images and starts them with MySQL, exactly like `docker compose up` locally
      - name: Start the app
        run: docker compose up -d --build

      - name: Wait until the API answers through the web app
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/actuator/health > /dev/null; then echo "App is up"; exit 0; fi
            sleep 5
          done
          echo "App didn't start in 5 minutes"; exit 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the end-to-end test
        working-directory: e2e
        run: npm test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/

      - name: App logs
        if: failure()
        run: docker compose logs --no-color app web

      - name: Stop the app
        if: always()
        run: docker compose down -v
