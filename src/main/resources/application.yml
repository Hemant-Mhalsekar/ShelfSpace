spring:
  application:
    name: shelfspace
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shelfspace}${DB_PARAMS:}   # e.g. ?allowPublicKeyRetrieval=true&useSSL=false on some hosts
    username: ${DB_USERNAME:shelfspace}
    password: ${DB_PASSWORD:shelfspace}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}   # use a smaller pool on small free-tier databases
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        format_sql: true
  data:
    web:
      pageable:
        max-page-size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}   # hosting platforms set PORT
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-of-at-least-32-bytes}
    access-token-minutes: 15
    refresh-token-days: 7
  rate-limit:
    login-max-failures: 5          # wrong passwords per email + IP ...
    login-lock-minutes: 15         # ... before a 15-minute lock
    auth-requests-per-minute: ${AUTH_RATE_LIMIT:30}   # register/login/refresh per IP; 0 = off
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
  jobs:
    # Spring cron: second minute hour day month weekday
    overdue-cron: "0 5 0 * * *"        # 00:05 every night
    due-reminder-cron: "0 0 9 * * *"   # 09:00 every morning
    hold-expiry-cron: "0 */15 * * * *" # every 15 minutes
    token-cleanup-cron: "0 30 3 * * *" # 03:30 every night
  seed:
    # Demo accounts for local testing. Set SEED_ENABLED=false in production.
    enabled: ${SEED_ENABLED:true}
    admin-email: ${SEED_ADMIN_EMAIL:admin@shelfspace.dev}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@12345}
    member-email: ${SEED_MEMBER_EMAIL:member@shelfspace.dev}
    member-password: ${SEED_MEMBER_PASSWORD:Member@12345}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
