spring:
  application:
    name: shelfspace
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shelfspace}
    username: ${DB_USERNAME:shelfspace}
    password: ${DB_PASSWORD:shelfspace}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        format_sql: true
  data:
    web:
      pageable:
        max-page-size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-of-at-least-32-bytes}
    access-token-minutes: 15
    refresh-token-days: 7
  seed:
    # Demo accounts for local testing. Set SEED_ENABLED=false in production.
    enabled: ${SEED_ENABLED:true}
    admin-email: ${SEED_ADMIN_EMAIL:admin@shelfspace.dev}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@12345}
    member-email: ${SEED_MEMBER_EMAIL:member@shelfspace.dev}
    member-password: ${SEED_MEMBER_PASSWORD:Member@12345}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
